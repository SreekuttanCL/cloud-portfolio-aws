name: Deploy Portfolio to AWS

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::886436948364:role/github-actions-cloud-portfolio-role
        aws-region: us-east-1

    - name: Deploy website to S3
      run: |
        aws s3 sync website/ s3://sreekuttan-cloud-portfolio --delete

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id E1KXEZE0Q2FA5A \
          --paths "/*"

